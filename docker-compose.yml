services:
  db:
    image: mariadb:11.4
    container_name: nextcloud-db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW --innodb-file-per-table=1 --skip-innodb-read-only-compressed
    volumes:
      - db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: nextcloudroot
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: nextcloud
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    image: nextcloud:apache
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - nextcloud:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: admin
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
    depends_on:
      db:
        condition: service_healthy

  # Host networking so Collabora can reach Nextcloud at localhost:8082 (same as the browser)
  collabora:
    image: collabora/code:latest
    container_name: nextcloud-collabora
    restart: unless-stopped
    network_mode: host
    environment:
      server_name: localhost:9980
      aliasgroup1: "http://localhost:8082"
      username: admin
      password: admin
      DONT_GEN_SSL_CERT: "1"
      extra_params: >
        --o:ssl.enable=false
        --o:ssl.termination=false
        --o:net.proto=IPv4
        --o:net.frame_ancestors=http://localhost:8082
        --o:welcome.enable=false
    cap_add:
      - MKNOD

  # Talk High Performance Backend (signaling + Janus + TURN)
  talk:
    image: ghcr.io/nextcloud-releases/aio-talk:latest
    container_name: nextcloud-talk
    init: true
    restart: unless-stopped
    ports:
      - "8181:8081"          # signaling (browser)
      - "3478:3478/tcp"      # TURN/STUN
      - "3478:3478/udp"
    # So Talk can call Nextcloud at http://localhost:8082 (browser origin)
    extra_hosts:
      - "localhost:host-gateway"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    environment:
      NC_DOMAIN: localhost
      TALK_HOST: localhost
      TALK_PORT: "3478"
      TURN_SECRET: e902d213f012f79027eaa9fcf881db1321452f4fb7965daa16797061eac209b1
      SIGNALING_SECRET: 3fc6083903a05cc13a3b921ecbf5f06c369f00ffd9a84ec2e82ee0bc18d69bed
      INTERNAL_SECRET: e94bd986239a8db83528b651ebcd0daf73179c328c1b412ecabd0a47ac67d0d0
      TZ: Europe/Berlin
      SKIP_CERT_VERIFY: "true"
    # aio-talk defaults to https://NC_DOMAIN; local Nextcloud is http://localhost:8082
    command:
      - bash
      - -c
      - |
        sed -i 's|urls = https://localhost|urls = http://localhost:8082|' /conf/signaling.conf
        exec dinit --system --container nats-server eturnal janus signaling

  # Lets Nextcloud reach Talk at localhost:8181 (same URL the browser uses)
  talk-proxy:
    image: alpine/socat
    container_name: nextcloud-talk-proxy
    restart: unless-stopped
    network_mode: "service:app"
    depends_on:
      - app
      - talk
    command: TCP-LISTEN:8181,fork,reuseaddr TCP:talk:8081

volumes:
  db:
  nextcloud:
