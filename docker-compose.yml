services:
  db:
    image: mariadb:11.4
    container_name: nextcloud-db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW --innodb-file-per-table=1 --skip-innodb-read-only-compressed
    volumes:
      - db:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nextcloud}
      MYSQL_USER: ${MYSQL_USER:-nextcloud}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    image: nextcloud:apache
    container_name: nextcloud
    restart: unless-stopped
    ports:
      - "${NEXTCLOUD_PORT:-8082}:80"
    volumes:
      - nextcloud:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nextcloud}
      MYSQL_USER: ${MYSQL_USER:-nextcloud}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-localhost}
      TZ: ${TZ:-UTC}
    depends_on:
      db:
        condition: service_healthy

  # Host networking so Collabora can reach Nextcloud at the browser URL
  collabora:
    image: collabora/code:latest
    container_name: nextcloud-collabora
    restart: unless-stopped
    network_mode: host
    environment:
      server_name: ${COLLABORA_DOMAIN:-localhost:9980}
      aliasgroup1: ${NEXTCLOUD_URL:-http://localhost:8082}
      username: ${COLLABORA_ADMIN_USER:-admin}
      password: ${COLLABORA_ADMIN_PASSWORD}
      DONT_GEN_SSL_CERT: "1"
      extra_params: >
        --o:ssl.enable=false
        --o:ssl.termination=false
        --o:net.proto=IPv4
        --o:net.frame_ancestors=${NEXTCLOUD_URL:-http://localhost:8082}
        --o:welcome.enable=false
    cap_add:
      - MKNOD

  # Talk High Performance Backend (signaling + Janus + TURN)
  talk:
    image: ghcr.io/nextcloud-releases/aio-talk:latest
    container_name: nextcloud-talk
    init: true
    restart: unless-stopped
    ports:
      - "${TALK_SIGNALING_PORT:-8181}:8081"
      - "${TALK_TURN_PORT:-3478}:3478/tcp"
      - "${TALK_TURN_PORT:-3478}:3478/udp"
    # So Talk can call Nextcloud at the browser origin (local http)
    extra_hosts:
      - "localhost:host-gateway"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    environment:
      NC_DOMAIN: ${NC_DOMAIN:-localhost}
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-http://localhost:8082}
      TALK_HOST: ${TALK_HOST:-localhost}
      TALK_PORT: ${TALK_TURN_PORT:-3478}
      TURN_SECRET: ${TURN_SECRET}
      SIGNALING_SECRET: ${SIGNALING_SECRET}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
      TZ: ${TZ:-UTC}
      SKIP_CERT_VERIFY: ${TALK_SKIP_CERT_VERIFY:-true}
    # aio-talk defaults to https://NC_DOMAIN; override to local Nextcloud URL
    command:
      - bash
      - -c
      - |
        sed -i "s|urls = https://$${NC_DOMAIN}|urls = $${NEXTCLOUD_URL}|" /conf/signaling.conf
        exec dinit --system --container nats-server eturnal janus signaling

  # Lets Nextcloud reach Talk at localhost:8181 (same URL the browser uses)
  talk-proxy:
    image: alpine/socat
    container_name: nextcloud-talk-proxy
    restart: unless-stopped
    network_mode: "service:app"
    depends_on:
      - app
      - talk
    command: TCP-LISTEN:${TALK_SIGNALING_PORT:-8181},fork,reuseaddr TCP:talk:8081

volumes:
  db:
  nextcloud:
